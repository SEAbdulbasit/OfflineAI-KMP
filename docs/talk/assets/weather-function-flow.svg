<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 650" role="img" aria-labelledby="title desc"><title id="title">Weather function-calling sequence</title><desc id="desc">Application supplies a tool definition to the model, receives a proposed weather call, queries a weather provider, returns the tool result and receives the final answer. All weather values shown are illustrative.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B9A5F4"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#eff0f4}.label{font-size:29px}.heading{font-size:34px;font-weight:600}.small{font-size:24px;fill:#b7b5be}.line{stroke:#B9A5F4;stroke-width:3;marker-end:url(#arrow)}.life{stroke:#50505a;stroke-width:2;stroke-dasharray:8 9}</style><rect x="25" y="0" width="350" height="87" rx="22" fill="#282238"/><text x="200" y="37" text-anchor="middle" class="heading">Your application</text><text x="200" y="68" text-anchor="middle" class="small">Owns execution</text><path class="life" d="M200 100V625"/><rect x="685" y="0" width="350" height="87" rx="22" fill="#282238"/><text x="860" y="37" text-anchor="middle" class="heading">Cloud model</text><text x="860" y="68" text-anchor="middle" class="small">Gemini example</text><path class="life" d="M860 100V625"/><rect x="1315" y="0" width="350" height="87" rx="22" fill="#282238"/><text x="1490" y="37" text-anchor="middle" class="heading">Weather provider</text><text x="1490" y="68" text-anchor="middle" class="small">External data source</text><path class="life" d="M1490 100V625"/><path class="line" d="M200 155H860"/><text class="label" x="530.0" y="138" text-anchor="middle">1 · Request + weather-tool definition</text><path class="line" d="M860 245H200"/><text class="label" x="530.0" y="228" text-anchor="middle">2 · Propose get_weather(location=&quot;Riyadh&quot;)</text><path class="line" d="M200 335H1490"/><text class="label" x="845.0" y="318" text-anchor="middle">3 · App validates location and queries provider</text><path class="line" d="M1490 425H200"/><text class="label" x="845.0" y="408" text-anchor="middle">4 · Provider returns data (mock: 26°C, sunny)</text><path class="line" d="M200 515H860"/><text class="label" x="530.0" y="498" text-anchor="middle">5 · App sends the tool result to the model</text><path class="line" d="M860 605H200"/><text class="label" x="530.0" y="588" text-anchor="middle">6 · Model answers using the returned data</text></svg>